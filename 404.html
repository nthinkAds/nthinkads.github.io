<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — N Think</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Same theme logic as the home page -->
  <script>
    (function () { var s = null; try { s = localStorage.getItem('nthink-theme'); } catch (e) {}
      document.documentElement.dataset.theme = (s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main style="min-height:100svh;display:grid;align-content:center;padding:var(--pad)">
    <p class="sec-head"><span class="sec-no">404</span> This page isn't here</p>
    <h1 class="contact-title">Off the trim line.</h1>
    <p><a class="btn" href="./">Go to the home page</a></p>
  </main>
</body>
</html>
